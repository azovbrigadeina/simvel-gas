<div id="p-land" style="min-height: 100vh; background: var(--accent); display: flex; align-items: center; color: white; text-align: center;">
  <div class="container fade-in">
    <!-- Role Selection -->
    <div id="role-selection">
      <img src="https://i.ibb.co.com/7dW9YHGM/logo-Simvel.png" alt="Logo SimVel" style="max-width: 350px; width: 90%; margin-bottom: 24px;">
      
      <!-- PP No. 18 Tahun 2016 Pill Badge -->
      <div class="mb-4">
        <div class="d-inline-flex align-items-center gap-2 px-4 py-2 rounded-pill bg-white shadow-sm mb-3" style="color: #004494;">
          <i class="bi bi-journal-text fs-5 text-primary"></i>
          <span class="fw-bold small">PP No. 18 Tahun 2016 tentang Perangkat Daerah</span>
        </div>
        <h5 class="fw-bold mb-0 opacity-90">Bagian Organisasi Setda Kab. Muaro Jambi</h5>
      </div>

      <div class="row justify-content-center g-3">
        <div class="col-md-3 col-sm-5" onclick="showLoginForm('Responden')">
          <div class="py-3 px-4 border rounded-3 bg-white bg-opacity-25 shadow-sm border-white border-opacity-25" style="cursor:pointer; transition: 0.25s all ease;" onmouseover="this.style.background='rgba(255,255,255,0.4)'; this.style.transform='translateY(-2px)'" onmouseout="this.style.background='rgba(255,255,255,0.25)'; this.style.transform='none'">
            <h5 class="fw-bold m-0 d-flex align-items-center justify-content-center gap-2"><i class="bi bi-pencil-square fs-5"></i> RESPONDEN</h5>
          </div>
        </div>
        <div class="col-md-3 col-sm-5" onclick="showLoginForm('Evaluator')">
          <div class="py-3 px-4 border rounded-3 bg-white bg-opacity-25 shadow-sm border-white border-opacity-25" style="cursor:pointer; transition: 0.25s all ease;" onmouseover="this.style.background='rgba(255,255,255,0.4)'; this.style.transform='translateY(-2px)'" onmouseout="this.style.background='rgba(255,255,255,0.25)'; this.style.transform='none'">
            <h5 class="fw-bold m-0 d-flex align-items-center justify-content-center gap-2"><i class="bi bi-shield-lock fs-5"></i> EVALUATOR</h5>
          </div>
        </div>
      </div>
    </div>

    <!-- Login Form -->
    <div id="login-form-container" class="hidden">
      <div class="login-card fade-in">
        <img src="https://i.ibb.co.com/7dW9YHGM/logo-Simvel.png" alt="Logo SimVel" style="max-width: 180px; margin-bottom: 30px;">
        <h4 class="text-dark fw-bold mb-1" id="login-title">LOGIN USER</h4>
        <p class="text-muted small mb-4" id="login-subtitle">Silakan masukkan akun Anda</p>
        
        <div class="login-input-group">
          <i class="bi bi-person-fill"></i>
          <input type="text" id="login-username" class="form-control" placeholder="Username" autocomplete="username">
        </div>
        
        <div class="login-input-group">
          <i class="bi bi-lock-fill"></i>
          <input type="password" id="login-password" class="form-control" placeholder="Password" autocomplete="current-password">
          <i class="bi bi-eye-fill" id="toggle-password" style="left: auto; right: 15px; cursor: pointer;" onclick="togglePasswordVisibility()"></i>
        </div>
        
        <button class="btn btn-primary w-100 btn-login mb-3" id="btn-submit-login" onclick="handleLoginSubmit()">
          MASUK <i class="bi bi-box-arrow-in-right ms-2"></i>
        </button>
        
        <a href="#" class="btn-back-login" onclick="hideLoginForm()">
          <i class="bi bi-arrow-left"></i> Kembali ke Pilihan Peran
        </a>
      </div>
    </div>
  </div>
</div>
