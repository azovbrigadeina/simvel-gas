<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
  let sess = {}, grp = {}, cats = [], ans = {}, vData = [];
  const DRIVE_REGEX = /^https:\/\/(drive|docs)\.google\.com\/.*$/;

  let currentRole = "";

  function showLoginForm(role) {
    currentRole = role;
    document.getElementById('role-selection').classList.add('hidden');
    document.getElementById('login-form-container').classList.remove('hidden');
    document.getElementById('login-title').innerText = "LOGIN " + role.toUpperCase();
    document.getElementById('login-username').focus();
    
    // Reset form
    document.getElementById('login-username').value = "";
    document.getElementById('login-password').value = "";
  }

  function hideLoginForm() {
    document.getElementById('role-selection').classList.remove('hidden');
    document.getElementById('login-form-container').classList.add('hidden');
  }

  const IDLE_TIMEOUT_MS = 30 * 60 * 1000; // 30 Menit
  let idleCheckerTimer = null;
  let lastTouchTime = 0;

  function updateLastActivity() {
    if (!sess || sess.status !== "success") return;
    const now = Date.now();
    sess.last_activity = now;
    try {
      localStorage.setItem('simvel_session', JSON.stringify(sess));
    } catch(e) {}
  }

  function handleUserActivity() {
    const now = Date.now();
    if (now - lastTouchTime > 10000) { // Throttling: maks update sekali tiap 10 detik
      lastTouchTime = now;
      updateLastActivity();
    }
  }

  function startIdleChecker() {
    stopIdleChecker();
    idleCheckerTimer = setInterval(() => {
      checkIdleSession();
    }, 30000); // Cek setiap 30 detik
  }

  function stopIdleChecker() {
    if (idleCheckerTimer) {
      clearInterval(idleCheckerTimer);
      idleCheckerTimer = null;
    }
  }

  function checkIdleSession() {
    try {
      const savedSessStr = localStorage.getItem('simvel_session');
      if (!savedSessStr) return;
      const savedSess = JSON.parse(savedSessStr);
      if (savedSess && savedSess.last_activity) {
        const diff = Date.now() - savedSess.last_activity;
        if (diff >= IDLE_TIMEOUT_MS) {
          stopIdleChecker();
          handleLogout();
          Swal.fire({
            icon: 'warning',
            title: 'Sesi Berakhir',
            text: 'Sesi login Anda telah berakhir otomatis karena tidak ada aktivitas selama 30 menit.',
            confirmButtonText: 'OK'
          });
        }
      }
    } catch(e) {}
  }

  function handleLogout() {
    stopIdleChecker();
    if (sess && sess.token) {
      try { google.script.run.logout(sess.token); } catch(e) {}
    }
    sess = {};
    grp = {};
    cats = [];
    ans = {};
    vData = [];
    try {
      localStorage.removeItem('simvel_session');
      localStorage.removeItem('simvel_page_eval');
      localStorage.removeItem('simvel_page_resp');
    } catch(e) {}
    
    // Sembunyikan panel evaluator, responden & sidebar
    document.getElementById('sidebar').classList.add('hidden');
    document.getElementById('p-eval').classList.add('hidden');
    document.getElementById('p-resp').classList.add('hidden');
    
    // Reset sidebar items
    document.getElementById('sidebar-title').innerText = "MONITORING";
    document.getElementById('l-user').classList.add('hidden');
    document.getElementById('l-pengaturan').classList.add('hidden');
    document.getElementById('l-laporan').classList.add('hidden');
    document.getElementById('l-reset').classList.add('hidden');
    
    // Sembunyikan seluruh sub-view evaluator dashboard
    ['dash','soal','val','user','laporan','pengaturan','reset'].forEach(i => {
      const vEl = document.getElementById('v-'+i);
      const lEl = document.getElementById('l-'+i);
      if(vEl) vEl.classList.add('hidden');
      if(lEl) lEl.classList.remove('active');
    });
    
    // Set default panel ke dashboard monitoring untuk login berikutnya
    document.getElementById('v-dash').classList.remove('hidden');
    document.getElementById('l-dash').classList.add('active');
    
    // Tampilkan kembali landing page pilihan peran
    document.getElementById('p-land').classList.remove('hidden');
    hideLoginForm();
  }

  function togglePasswordVisibility() {
    const pInput = document.getElementById('login-password');
    const pIcon = document.getElementById('toggle-password');
    if (pInput.type === "password") {
      pInput.type = "text";
      pIcon.classList.replace('bi-eye-fill', 'bi-eye-slash-fill');
    } else {
      pInput.type = "password";
      pIcon.classList.replace('bi-eye-slash-fill', 'bi-eye-fill');
    }
  }

  function showLoadingScreen(statusText) {
    const el = document.getElementById('loading-screen');
    el.classList.remove('hidden', 'loading-screen-fade-out');
    if (statusText) document.getElementById('loading-status-text').innerText = statusText;
  }
  function updateLoadingStatus(text) {
    const el = document.getElementById('loading-status-text');
    if (el) el.innerText = text;
  }
  function hideLoadingScreen() {
    const el = document.getElementById('loading-screen');
    el.classList.add('loading-screen-fade-out');
    setTimeout(() => el.classList.add('hidden'), 500);
  }

  function applySession(res) {
    sess = res;
    sess.last_activity = Date.now();
    try {
      localStorage.setItem('simvel_session', JSON.stringify(sess));
    } catch(e) {}
    startIdleChecker();

    document.getElementById('p-land').classList.add('hidden');
    showLoadingScreen('Menyiapkan antarmuka...');

    if(res.role === "Responden") {
      document.getElementById('p-resp').classList.remove('hidden');
      document.getElementById('opd-name').innerText = res.nama_opd;
      updateLoadingStatus('Mengambil data pertanyaan dari server...');
      initR();
    } else {
      document.getElementById('sidebar').classList.remove('hidden');
      document.getElementById('p-eval').classList.remove('hidden');
      
      document.getElementById('l-pengaturan').classList.remove('hidden');
      document.getElementById('l-laporan').classList.remove('hidden');
      document.getElementById('l-reset').classList.remove('hidden');
      
      if(res.role === "Admin") {
        document.getElementById('sidebar-title').innerText = "ADMIN";
        document.getElementById('l-user').classList.remove('hidden');
      } else {
        document.getElementById('sidebar-title').innerText = "EVALUATOR";
      }

      let lastPage = 'dash';
      try {
        const savedPage = localStorage.getItem('simvel_page_eval');
        if (savedPage && ['dash','soal','val','user','laporan','pengaturan','reset'].indexOf(savedPage) !== -1) {
          if (savedPage === 'user' && res.role !== "Admin") {
            lastPage = 'dash';
          } else {
            lastPage = savedPage;
          }
        } else {
          try { localStorage.removeItem('simvel_page_eval'); } catch(e) {}
        }
      } catch(e) {}

      updateLoadingStatus('Memuat dashboard monitoring...');
      loadStats();
      setTimeout(() => hideLoadingScreen(), 1200);
      if (lastPage !== 'dash') {
        setTimeout(() => showV(lastPage), 50);
      }
    }
  }

  function handleLoginSubmit() {
    const u = document.getElementById('login-username').value;
    const p = document.getElementById('login-password').value;
    
    if(!u || !p) {
      Swal.fire('Info', 'Username dan Password harus diisi!', 'info');
      return;
    }

    Swal.showLoading();
    serverCall().withSuccessHandler(res => {
      Swal.close();
      if(res.status === "success") {
        applySession(res);
      } else {
        Swal.fire('Error', res.message, 'error');
      }
    }).prosesLogin(u, p);
  }

  // Restore persistent session on page refresh & listen to activity
  document.addEventListener('DOMContentLoaded', function () {
    ['mousemove', 'keydown', 'click', 'touchstart', 'scroll'].forEach(evt => {
      window.addEventListener(evt, handleUserActivity, { passive: true });
    });

    try {
      const savedSessStr = localStorage.getItem('simvel_session');
      if (savedSessStr) {
        const savedSess = JSON.parse(savedSessStr);
        if (savedSess && savedSess.status === "success" && savedSess.role) {
          const lastAct = savedSess.last_activity || Date.now();
          if (Date.now() - lastAct >= IDLE_TIMEOUT_MS) {
            localStorage.removeItem('simvel_session');
            Swal.fire({
              icon: 'warning',
              title: 'Sesi Berakhir',
              text: 'Sesi login Anda telah berakhir otomatis karena tidak ada aktivitas selama 30 menit.'
            });
            return;
          }
          applySession(savedSess);
        }
      }
    } catch(e) {}
  });

  // Handle Enter Key
  document.addEventListener('keypress', function (e) {
    if (e.key === 'Enter') {
      const loginContainer = document.getElementById('login-form-container');
      if (loginContainer && !loginContainer.classList.contains('hidden')) {
        handleLoginSubmit();
      }
    }
  });

  function escHtml(v) {
    return String(v === undefined || v === null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function escAttr(v) {
    return escHtml(v).replace(/\n/g, ' ');
  }

  // Escape untuk nilai yang ditempatkan di dalam string JS pada atribut onclick.
  // escHtml/escAttr saja tidak cukup: entitas &#39; akan kembali menjadi kutip
  // saat HTML diparse dan memutus string JS.
  function escJsAttr(v) {
    return escAttr(String(v === undefined || v === null ? '' : v).replace(/\\/g, '\\\\').replace(/'/g, "\\'"));
  }

  function serverCall() {
    const token = (sess && sess.token) ? sess.token : "";
    return google.script.run
      .withFailureHandler(err => {
        const msg = (err && err.message) ? err.message : String(err);
        if (msg.indexOf('Sesi tidak valid') !== -1) {
          handleLogout();
          Swal.fire('Sesi Berakhir', 'Sesi Anda telah berakhir. Silakan login ulang.', 'warning');
        } else {
          Swal.fire('Error', msg, 'error');
        }
      });
  }

  let parentCat = {};

  let isDeadlinePassed = false;
  let isOPDSudahKirim = false;
  let deadlineTimerInterval;

  function initR() {
    updateLoadingStatus('Memeriksa batas waktu pengisian...');
    grp = {}; cats = []; parentCat = {}; isOPDSudahKirim = false;
    
    // Check deadline first
    serverCall().withSuccessHandler(res => {
      let deadlineStr = "";
      let deadlineUtc = 0;
      try {
        const opdDeadlines = JSON.parse(res.deadline_opd || '{}');
        if (opdDeadlines[sess.nama_opd]) {
          deadlineStr = opdDeadlines[sess.nama_opd];
          const opdUtc = (res.deadline_opd_utc || {})[sess.nama_opd];
          deadlineUtc = opdUtc || new Date(deadlineStr).getTime();
        } else {
          deadlineStr = res.deadline_global || "";
          deadlineUtc = res.deadline_global_utc || 0;
        }
      } catch(e) {
        deadlineStr = res.deadline_global || "";
        deadlineUtc = res.deadline_global_utc || 0;
      }

      startDeadlineTimer(deadlineStr, deadlineUtc);
      
      // Fetch Draft first
      updateLoadingStatus('Memuat draf isian sebelumnya...');
      let localDraft = {};
      try {
        const dStr = localStorage.getItem('simvel_draft_' + sess.nama_opd);
        if (dStr) localDraft = JSON.parse(dStr);
      } catch(e) {}

      serverCall().withSuccessHandler(resDraft => {
        let serverDraft = {};
        if (resDraft && typeof resDraft === 'object' && resDraft.hasOwnProperty('isSubmitted')) {
          serverDraft = resDraft.draft || {};
          isOPDSudahKirim = !!resDraft.isSubmitted;
        } else {
          serverDraft = resDraft || {};
          isOPDSudahKirim = false;
        }

        if (isOPDSudahKirim) {
          ans = Object.assign({}, serverDraft);
          try { localStorage.removeItem('simvel_draft_' + sess.nama_opd); } catch(e) {}
        } else {
          ans = Object.assign({}, serverDraft || {}, localDraft || {});
        }

        // Fetch Pertanyaan
        updateLoadingStatus('Menyusun formulir pengisian...');
        serverCall().withSuccessHandler(data => {
          data.forEach(r => {
            let ut = r[1] ? r[1].trim() : "Lainnya";
            let sub = r[2] ? r[2].trim() : "Umum";
            let key = ut + "|||" + sub;

            if(!grp[key]) { 
              grp[key] = []; 
              cats.push(key); 
              parentCat[key] = { utama: ut, subkat: sub };
            }
            grp[key].push(r);
          });
          let lastIdx = 0;
          try {
            const savedIdx = parseInt(localStorage.getItem('simvel_page_resp'), 10);
            if (!isNaN(savedIdx) && savedIdx >= 0 && savedIdx < cats.length) {
              lastIdx = savedIdx;
            } else {
              try { localStorage.removeItem('simvel_page_resp'); } catch(e) {}
            }
          } catch(e) {}
          showS(lastIdx);
          hideLoadingScreen();

          if (isOPDSudahKirim) {
            const Toast = Swal.mixin({
              toast: true,
              position: 'top-end',
              showConfirmButton: false,
              timer: 4000,
              timerProgressBar: true
            });
            Toast.fire({
              icon: 'info',
              title: 'Formulir Terkunci: Jawaban telah dikirim sebelumnya.'
            });
          } else if (Object.keys(ans).length > 0) {
            const Toast = Swal.mixin({
              toast: true,
              position: 'top-end',
              showConfirmButton: false,
              timer: 3500,
              timerProgressBar: true
            });
            Toast.fire({
              icon: 'info',
              title: 'Draf isian sebelumnya berhasil dimuat.'
            });
          }
        }).getPertanyaan(sess.nama_opd);
      }).getDraftJawaban(sess.nama_opd);
    }).getDeadlineSettings();
  }

  function startDeadlineTimer(deadlineStr, deadlineUtcOverride) {
    const banner = document.getElementById('deadline-banner');
    const textEl = document.getElementById('deadline-text');
    const countEl = document.getElementById('deadline-countdown');

    if (deadlineTimerInterval) clearInterval(deadlineTimerInterval);

    if (!deadlineStr) {
      banner.classList.add('d-none');
      isDeadlinePassed = false;
      return;
    }

    banner.classList.remove('d-none');
    // Gunakan timestamp UTC dari server jika tersedia agar perhitungan
    // countdown konsisten dengan pengecekan server-side, terlepas dari timezone browser.
    const deadlineTime = (deadlineUtcOverride && !isNaN(deadlineUtcOverride))
      ? deadlineUtcOverride
      : new Date(deadlineStr).getTime();
    
    function updateTimer() {
      const now = new Date().getTime();
      const distance = deadlineTime - now;
      
      if (distance < 0) {
        clearInterval(deadlineTimerInterval);
        isDeadlinePassed = true;
        banner.classList.remove('alert-warning', 'alert-info');
        banner.classList.add('alert-danger');
        textEl.innerText = "Waktu pengisian telah melewati batas yang ditentukan.";
        countEl.innerHTML = '<i class="bi bi-x-circle-fill"></i> BERAKHIR';
        
        // Hide Kirim button if exists
        const btnKirim = document.getElementById('btn-kirim-ans');
        if(btnKirim && btnKirim.innerText.includes('KIRIM')) btnKirim.classList.add('d-none');
        
        // Disable inputs
        const inputs = document.querySelectorAll('#f-cont input, #f-cont textarea');
        inputs.forEach(el => el.disabled = true);
      } else {
        isDeadlinePassed = false;
        banner.classList.remove('alert-danger');
        banner.classList.add('alert-warning');
        
        const dStr = new Date(deadlineTime).toLocaleString('id-ID', {day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit', timeZone:'Asia/Jakarta'});
        textEl.innerText = `Batas akhir: ${dStr}`;
        
        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        
        if(days > 0) countEl.innerText = `${days} Hari ${hours} Jam`;
        else countEl.innerText = `${hours} Jam ${minutes} Mnt`;
      }
    }
    
    updateTimer();
    deadlineTimerInterval = setInterval(updateTimer, 60000);
  }

  function showS(idx) {
    if (idx < 0 || idx >= cats.length) return;
    try { localStorage.setItem('simvel_page_resp', String(idx)); } catch(e) {}
    const key = cats[idx], qs = grp[key], cont = document.getElementById('f-cont');
    const katInfo = parentCat[key];
    
    let dis = (isDeadlinePassed || isOPDSudahKirim) ? 'disabled' : '';

    let lockedBanner = isOPDSudahKirim ? `
      <div class="alert alert-info border-start border-4 border-info shadow-sm p-3 mb-4 rounded-3 d-flex align-items-center">
        <i class="bi bi-lock-fill fs-2 text-info me-3"></i>
        <div>
          <h5 class="fw-bold mb-1 text-info">Formulir Terkunci (Jawaban Telah Terkirim)</h5>
          <p class="mb-0 small text-dark">OPD <strong>${escHtml(sess.nama_opd)}</strong> telah resmi mengirimkan jawaban. Formulir dalam mode <em>hanya lihat (read-only)</em> dan tidak dapat diubah kembali kecuali dilakukan <strong>Reset Jawaban</strong> oleh Administrator.</p>
        </div>
      </div>` : '';
    
    let h = lockedBanner + `
      <div class="p-3 mb-4 bg-primary text-white rounded shadow-sm text-center">
        <h4 class="fw-bold mb-2 text-uppercase" style="white-space: normal; word-break: break-word; line-height: 1.3;">${escHtml(katInfo.utama)}</h4>
        <div class="badge bg-light text-primary fs-6 px-3 py-2 shadow-sm" style="white-space: normal; word-break: break-word; line-height: 1.4; max-width: 100%; display: inline-block;">
          ${escHtml(katInfo.subkat)}
        </div>
      </div>`;

    qs.forEach(q => {
      const s = ans[q[0]] || {id: q[0], skala:"", link:"", pilihan_teks: "", nama_dokumen: "", sistem_nilai: "", sumber_data: "", penjelasan: ""};
      let weights = q[8] ? q[8].toString().split('|') : [0,0,0,0,0];
      const labels = ['A', 'B', 'C', 'D', 'E'];

      let radioHtml = `<div class="mt-2">`;
      labels.forEach((lab, i) => {
        let bbt = weights[i] ? weights[i].trim() : "0";
        let inputId = `q_${q[0]}_${lab}`;
        let isChecked = s.pilihan_teks === lab ? 'checked' : '';
        radioHtml += `
          <div class="form-check mb-2 p-2 border rounded-3 bg-light bg-opacity-50">
            <input class="form-check-input ms-1" type="radio" name="radio_${escAttr(q[0])}" 
              id="${escAttr(inputId)}" value="${escAttr(bbt)}" data-teks="${lab}" 
              onchange="savRadio('${escJsAttr(q[0])}', this)" ${isChecked} ${dis}>
            <label class="form-check-label ms-2" for="${escAttr(inputId)}">
              <strong>${lab}.</strong> <span class="text-muted small ms-2">(Bobot: ${escHtml(bbt)})</span>
            </label>
          </div>`;
      });
      radioHtml += `</div>`;

      h += `
      <div class="q-card" id="q-card-${escAttr(q[0])}">
        <h5 class="fw-bold mb-3">${escHtml(q[3])} <span class="text-danger">*</span></h5> 
        <div class="deskripsi-box mb-4">${escHtml(q[4]||'').replace(/\n/g,'<br>')}</div> 
        <div class="row g-3">
          <div class="col-md-6">
            <label class="small fw-bold text-muted mb-2">Pilih Jawaban: <span class="text-danger">*</span></label>
            ${radioHtml}
          </div>
          <div class="col-md-6">
            <label class="small fw-bold text-muted mb-2">Sistem (Nilai): <span class="text-danger">*</span></label>
            <input type="text" id="nilai-${escAttr(q[0])}" class="form-control border-primary mb-3" value="${escAttr(s.sistem_nilai || '')}" oninput="savSistemNilai('${escJsAttr(q[0])}',this)" placeholder="contoh: Nilai satuan sebenarnya misal 123 Desa" ${dis}>

            <label class="small fw-bold text-muted mb-2">Data Dokumen Pendukung: <span class="text-danger">*</span></label>
            <input type="text" id="doc-${escAttr(q[0])}" class="form-control border-primary mb-3" value="${escAttr(s.nama_dokumen || '')}" oninput="savDocName('${escJsAttr(q[0])}',this)" placeholder="Contoh: SK Tim Pelaksana, Laporan Kegiatan, dsb" ${dis}>

            <label class="small fw-bold text-muted mb-2">Link Bukti Dukung (Google Drive): <span class="text-danger">*</span></label>
            <textarea id="link-${escAttr(q[0])}" class="form-control border-primary mb-3 ${s.link && !/^https:\/\/(drive|docs)\.google\.com\/.*$/.test(s.link) ? 'is-invalid' : (s.link ? 'is-valid' : '')}" rows="2" oninput="savLinkVal('${escJsAttr(q[0])}',this)" placeholder="https://drive.google.com/..." ${dis}>${escHtml(s.link)}</textarea>
            <div class="invalid-feedback">Link harus berasal dari Google Drive (drive.google.com atau docs.google.com)</div>
            <div class="valid-feedback">Link valid!</div>
            
            <label class="small fw-bold text-muted mb-2 mt-3">Sumber Data & Tahun Data: <span class="text-danger">*</span></label>
            <input type="text" id="sumber-${escAttr(q[0])}" class="form-control border-primary mb-3" value="${escAttr(s.sumber_data || '')}" oninput="savSumberData('${escJsAttr(q[0])}',this)" placeholder="Contoh: BPS 2023, Laporan Dinas 2024" ${dis}>
            
            <label class="small fw-bold text-muted mb-2">Penjelasan: <span class="text-danger">*</span></label>
            <textarea id="penjelasan-${escAttr(q[0])}" class="form-control border-primary" rows="2" oninput="savPenjelasan('${escJsAttr(q[0])}',this)" placeholder="Buat Narasi Singkat tentang Data Tersebut" ${dis}>${escHtml(s.penjelasan || '')}</textarea>
            
            <div class="mt-3 small text-secondary"><i class="bi bi-info-circle"></i> Pastikan akses link disetel ke "Siapa saja yang memiliki link"</div>
          </div>
        </div>
      </div>`;
    });

    let btnLanjutKirim = idx < cats.length - 1 ? 'LANJUT' : 'KIRIM JAWABAN';
    let hideKirim = ((isDeadlinePassed || isOPDSudahKirim) && idx === cats.length - 1) ? 'd-none' : '';
    let disDraft = (isDeadlinePassed || isOPDSudahKirim) ? 'disabled' : '';

    h += `
    <div class="d-flex justify-content-between align-items-center pb-5 mt-4 flex-wrap gap-2">
      <button class="btn btn-secondary px-4" onclick="showS(${idx-1})" ${idx===0?'disabled':''}>KEMBALI</button>
      <div>
        <button class="btn btn-outline-warning text-dark px-4 fw-bold me-2 ${isOPDSudahKirim ? 'd-none' : ''}" onclick="simpanDrafManual()" title="Simpan isian sementara tanpa mengirim akhir" ${disDraft}>
          <i class="bi bi-bookmark-check-fill me-1"></i> SIMPAN DRAF
        </button>
        <button id="btn-kirim-ans" class="btn btn-primary px-5 fw-bold ${hideKirim}" onclick="${idx<cats.length-1?`handleLanjut(${idx})`:`finS()`}">
          ${btnLanjutKirim}
        </button>
      </div>
    </div>`;
    cont.innerHTML = h; window.scrollTo(0,0);
  }

  function validateCategory(idx) {
    if (idx < 0 || idx >= cats.length) return true;
    const key = cats[idx];
    const questions = grp[key] || [];
    let missing = [];

    questions.forEach((q, qIndex) => {
      const qId = q[0];
      const a = ans[qId];
      const noSoal = qIndex + 1;
      const cardEl = document.getElementById(`q-card-${qId}`);
      if (cardEl) cardEl.classList.remove('border-danger', 'border-3', 'shadow');

      let qMissing = [];

      if (!a || !a.pilihan_teks) {
        qMissing.push("Pilihan jawaban (A/B/C/D/E)");
      }
      if (!a || a.sistem_nilai === undefined || a.sistem_nilai === null || String(a.sistem_nilai).trim() === "") {
        qMissing.push("Sistem (Nilai)");
      }
      if (!a || !a.nama_dokumen || String(a.nama_dokumen).trim() === "") {
        qMissing.push("Data Dokumen Pendukung");
      }
      if (!a || !a.link || String(a.link).trim() === "") {
        qMissing.push("Link Bukti Dukung (Google Drive)");
      } else if (!DRIVE_REGEX.test(String(a.link).trim())) {
        qMissing.push("Link Bukti Dukung tidak valid (Harus link Google Drive)");
      }
      if (!a || !a.sumber_data || String(a.sumber_data).trim() === "") {
        qMissing.push("Sumber Data & Tahun Data");
      }
      if (!a || !a.penjelasan || String(a.penjelasan).trim() === "") {
        qMissing.push("Penjelasan");
      }

      if (qMissing.length > 0) {
        if (cardEl) cardEl.classList.add('border-danger', 'border-3', 'shadow');
        missing.push(`<strong>Soal No. ${noSoal}</strong>: ${qMissing.join(', ')}`);
      }
    });

    if (missing.length > 0) {
      Swal.fire({
        title: 'Isian Belum Lengkap!',
        html: `
          <div class="text-start small" style="max-height: 280px; overflow-y: auto;">
            <p class="text-danger fw-bold mb-2">
              <i class="bi bi-exclamation-triangle-fill me-1"></i> 
              Seluruh isian wajib diisi dengan lengkap & valid sebelum dapat melanjutkan ke kategori berikutnya:
            </p>
            <ul class="ps-3 mb-0">
              ${missing.map(m => `<li class="mb-1">${m}</li>`).join('')}
            </ul>
          </div>
        `,
        icon: 'warning',
        confirmButtonText: 'Lengkapi Isian',
        confirmButtonColor: '#0d6efd'
      });
      return false;
    }
    return true;
  }

  function finS() { 
    // Strict Validation: Check all questions across all categories
    let missingAll = [];
    
    Object.keys(grp).forEach(catKey => {
      const katInfo = parentCat[catKey] || { subkat: "Kategori" };
      grp[catKey].forEach((q, qIndex) => {
        const qId = q[0];
        const a = ans[qId];
        const pertanyaanShort = String(q[3] || "Soal").substring(0, 40) + "...";
        let qMissing = [];
        
        if(!a || !a.pilihan_teks) qMissing.push("Pilihan jawaban");
        if(!a || a.sistem_nilai === undefined || a.sistem_nilai === null || String(a.sistem_nilai).trim() === "") qMissing.push("Sistem (Nilai)");
        if(!a || !a.nama_dokumen || String(a.nama_dokumen).trim() === "") qMissing.push("Data Dokumen Pendukung");
        if(!a || !a.link || String(a.link).trim() === "") {
          qMissing.push("Link Bukti Dukung");
        } else if(!DRIVE_REGEX.test(String(a.link).trim())) {
          qMissing.push("Link Google Drive tidak valid");
        }
        if(!a || !a.sumber_data || String(a.sumber_data).trim() === "") qMissing.push("Sumber Data");
        if(!a || !a.penjelasan || String(a.penjelasan).trim() === "") qMissing.push("Penjelasan");

        if(qMissing.length > 0) {
          missingAll.push(`<strong>${katInfo.subkat}</strong> (Soal: "${pertanyaanShort}"): ${qMissing.join(', ')}`);
        }
      });
    });
    
    if(missingAll.length > 0) {
      Swal.fire({
        title: 'Formulir Belum Lengkap',
        html: `<div class="text-start small" style="max-height: 280px; overflow-y: auto;">
                <p class="fw-bold text-danger mb-2"><i class="bi bi-x-circle-fill me-1"></i> Jawaban tidak dapat dikirim karena masih terdapat ${missingAll.length} data yang belum diisi/valid:</p>
                <ul class="ps-3 mb-0">
                  ${missingAll.map(m => `<li class="mb-1">${m}</li>`).join('')}
                </ul>

               <p class="mt-3 small text-muted">Silakan lengkapi seluruh isian wajib pada semua kategori terlebih dahulu.</p>`,
        icon: 'error',
        confirmButtonText: 'Lengkapi Sekarang',
        confirmButtonColor: '#dc3545'
      });
      return;
    }

    Swal.fire({
      title: 'Kirim Jawaban Sekarang?',
      text: 'Pastikan semua data sudah benar. Setelah dikirim, data jawaban akan tersimpan secara definitif ke sistem.',
      icon: 'question',
      showCancelButton: true,

  // Validasi by Sub Kategori
  function filterUrusanTable(query) {
    const q = (query || "").toLowerCase();
    const rows = document.querySelectorAll('#val-subkat-list tr');
    rows.forEach(row => {
      const text = row.innerText.toLowerCase();
      if (text.includes(q)) {
        row.style.display = '';
      } else {
        row.style.display = 'none';
      }
    });
  }

  function loadSubKat() {
    document.getElementById('val-subkat-view').classList.remove('hidden');
    document.getElementById('val-form-view').classList.add('hidden');
    const searchInput = document.getElementById('search-urusan-input');
    if (searchInput) searchInput.value = '';

    Swal.showLoading();
    serverCall().withSuccessHandler(res => {
      Swal.close();
      
      // Urutkan data: 1. Selesai, 2. Progress Validasi, 3. Belum ada data
      res.sort((a, b) => {
        let valA = (a.total_jawaban > 0 && a.total_divalidasi >= a.total_jawaban) ? 3 : (a.total_jawaban > 0 ? 2 : 1);
        let valB = (b.total_jawaban > 0 && b.total_divalidasi >= b.total_jawaban) ? 3 : (b.total_jawaban > 0 ? 2 : 1);
        return valB - valA;
      });
      
      let h = '';
      res.forEach(s => {
        let statusBadge = '';
        let btnClass = 'btn-primary';
        if (s.total_jawaban === 0) {
           statusBadge = '<span class="badge bg-secondary">Belum ada data</span>';
           btnClass = 'btn-outline-secondary';
        } else if (s.total_divalidasi >= s.total_jawaban) {
           statusBadge = '<span class="badge bg-success"><i class="bi bi-check-circle me-1"></i> Selesai</span>';
           btnClass = 'btn-success';
        } else {
           statusBadge = `<span class="badge bg-warning text-dark"><i class="bi bi-hourglass-split me-1"></i> Validasi: ${s.total_divalidasi}/${s.total_jawaban}</span>`;
        }
        
        // Badge butir "Tidak Bisa Dinilai" (skor 0) — tidak mengubah status Selesai
        const takDinilaiBadge = (Number(s.total_tak_dinilai || 0) > 0)
          ? `<span class="badge bg-danger bg-opacity-10 text-danger border border-danger border-opacity-25 ms-1"><i class="bi bi-exclamation-triangle me-1"></i> ${s.total_tak_dinilai} tak bisa dinilai</span>`
          : '';
        
        h += `
        <tr>
          <td class="fw-bold text-primary"><i class="bi bi-folder2-open me-2 text-secondary"></i>${escHtml(s.nama)}</td>
          <td>${statusBadge}${takDinilaiBadge}</td>
          <td class="text-end">
            <button class="btn ${btnClass} btn-sm fw-bold px-3" onclick="muatValidasi('${escJsAttr(s.nama)}')"><i class="bi bi-pencil-square me-1"></i> BUKA VALIDASI</button>
          </td>
        </tr>`;
      });
      document.getElementById('val-subkat-list').innerHTML = h;
    }).withFailureHandler(err => {
      Swal.fire('Error', 'Gagal memuat daftar urusan: ' + (err.message || err), 'error');
    }).getSubKategoriStats();
  }

  let currentActiveSubKat = "";

  function formatTimestampDisplay(tsStr) {
    if (!tsStr) return "Belum tercatat";
    try {
      const d = new Date(tsStr);
      if (isNaN(d.getTime())) return tsStr;
      return d.toLocaleDateString('id-ID', {
        day: '2-digit', month: '2-digit', year: 'numeric',
        hour: '2-digit', minute: '2-digit', second: '2-digit'
      }) + " WIB";
    } catch (e) {
      return tsStr;
    }
  }

  function doRefreshSnapshotSubKat() {
    if (!currentActiveSubKat) return;
    Swal.fire({
      title: 'Memproses Snapshot Ulang...',
      text: `Sistem sedang menyalin seluruh folder & subfolder bukti dukung OPD pada Urusan "${currentActiveSubKat}"...`,
      allowOutsideClick: false,
      didOpen: () => Swal.showLoading()
    });
    serverCall().withSuccessHandler(res => {
      Swal.close();
      if (res && res.success) {
        Swal.fire('Berhasil', res.message, 'success');
        muatValidasi(currentActiveSubKat);
      } else {
        Swal.fire('Error', res ? res.message : 'Gagal memproses snapshot', 'error');
      }
    }).resnapshotBySubKategori(sess.token, currentActiveSubKat);

  function doRefreshSnapshotSingleOPD(opdName) {
    if (!opdName) return;
    Swal.fire({

      text: `Sistem sedang menyalin seluruh folder & subfolder bukti dukung untuk ${opdName}...`,
      allowOutsideClick: false,

  function renderKriteriaBobotBox(indikatorText, bobotStr) {
    const weights = bobotStr ? bobotStr.split('|') : [0,0,0,0,0];
    const labels = ['A', 'B', 'C', 'D', 'E'];
    
    if (!indikatorText) {
      let badgeHtml = '<div class="d-flex flex-wrap gap-2 mt-1">';
      labels.forEach((lab, k) => {
        let bbt = weights[k] ? weights[k].trim() : "0";
        badgeHtml += `<span class="badge bg-white text-dark border"><strong class="text-primary">${lab}</strong>: Bobot ${bbt}</span>`;
      });
      badgeHtml += '</div>';
      return badgeHtml;
    }

    const lines = indikatorText.split('\n').map(l => l.trim()).filter(l => l !== '');
    let parsedMap = {};
    lines.forEach(line => {
      const match = line.match(/^([A-E])[\.\)]\s*(.*)/i);
      if (match) {
        parsedMap[match[1].toUpperCase()] = match[2];
      }
    });

    if (Object.keys(parsedMap).length > 0) {
      let listHtml = '<div class="row g-2 mt-2">';
      labels.forEach((lab, k) => {
        let bbt = weights[k] ? weights[k].trim() : "0";
        let desc = parsedMap[lab] || '-';
        listHtml += `
          <div class="col-md-6 col-lg-4">
            <div class="p-2 border rounded bg-white h-100 d-flex justify-content-between align-items-center shadow-sm">
              <div class="small me-2">
                <strong class="text-primary fs-6">${lab}.</strong> ${escHtml(desc)}
              </div>
              <span class="badge bg-success bg-opacity-10 text-success border border-success border-opacity-25 px-2 py-1 flex-shrink-0">Bobot: ${escHtml(bbt)}</span>
            </div>
          </div>`;
      });
      listHtml += '</div>';
      return listHtml;
    } else {
      let badgeHtml = '<div class="d-flex flex-wrap gap-2 mb-2">';
      labels.forEach((lab, k) => {
        let bbt = weights[k] ? weights[k].trim() : "0";
        badgeHtml += `<span class="badge bg-white text-dark border"><strong class="text-primary">${lab}</strong>: Bobot ${bbt}</span>`;
      });
      badgeHtml += '</div>';
      badgeHtml += `<div class="small text-secondary bg-white p-2 border rounded shadow-sm">${escHtml(indikatorText).replace(/\n/g, '<br>')}</div>`;
      return badgeHtml;
    }
  }

  function muatValidasi(subKat) {
    if(!subKat) return;
    currentActiveSubKat = subKat;
    document.getElementById('val-subkat-view').classList.add('hidden');
    document.getElementById('val-form-view').classList.remove('hidden');
    document.getElementById('val-active-subkat').innerText = `Validasi Urusan: ${subKat}`;
    
    const switchEl = document.getElementById('switch-link-asli');
    if (switchEl) switchEl.checked = showLinkAsli;

    Swal.showLoading();
    serverCall().withSuccessHandler(data => {
      Swal.close();
      vData = data; 
      document.getElementById('btn-save-val').classList.remove('hidden');
      renderValList();
    }).withFailureHandler(err => {
      Swal.fire('Error', 'Gagal memuat data validasi: ' + (err.message || err), 'error');
    }).getJawabanBySubKategori(subKat);
  }

  function pilihSkorSelect(i, j, skorVal) {
    if (!vData || !vData[i] || !vData[i].jawaban_opd[j]) return;
    vData[i].jawaban_opd[j].skala_evaluator = skorVal;
    // Memilih skor A-E berarti membatalkan tanda "Tidak Bisa Dinilai".
    ['btn-taknilai-', 'pill-taknilai-'].forEach(pfx => {
      const el = document.getElementById(pfx + i + '-' + j);
      if (el) el.classList.remove('active');
    });
  }

  function pilihTakBisaDinilai(i, j) {
    if (!vData || !vData[i] || !vData[i].jawaban_opd[j]) return;
    const ans = vData[i].jawaban_opd[j];
    ans.skala_evaluator = 0;

    // Reset tampilan pill/select (tidak ada pilihan A-E yang bernilai 0)
    const sel = document.getElementById(`sel-eval-${i}-${j}`);
    if (sel) sel.value = "";
    const group = document.getElementById(`score-pill-group-${i}-${j}`);
    if (group) group.querySelectorAll('.score-pill-btn').forEach(btn => btn.classList.remove('active'));

    // Tandai tombol aktif (classic: btn-taknilai-*, modern: pill-taknilai-*)
    ['btn-taknilai-', 'pill-taknilai-'].forEach(pfx => {
      const el = document.getElementById(pfx + i + '-' + j);
      if (el) el.classList.add('active');
    });

    // Catatan wajib: fokuskan input catatan pada kartu ini
    const cat = document.getElementById(`catatan-eval-${i}-${j}`);
    if (cat) { cat.focus(); cat.scrollIntoView({ behavior: 'smooth', block: 'center' }); }

    Swal.fire({
      icon: 'warning',
      title: 'Tidak Bisa Dinilai',
      text: 'Butir ini diberi skor 0. Catatan alasan WAJIB diisi sebelum menyimpan.',
      timer: 2500,
      showConfirmButton: false
    });
  }

  function samakanSkor(i, j, skor) {
    if (!vData || !vData[i] || !vData[i].jawaban_opd || !vData[i].jawaban_opd[j]) return;
    
    const ans = vData[i].jawaban_opd[j];
    const rawSkor = (skor !== undefined && skor !== null && skor !== "") ? skor : ans.skala_responden;
    const skorStr = (rawSkor !== undefined && rawSkor !== null) ? rawSkor.toString().trim() : "";
    
    if (skorStr === "" || skorStr === "-" || isNaN(Number(skorStr))) {
      Swal.fire({
        icon: 'info',
        title: 'Skor Belum Ada',
        text: 'Responden belum mengisi skor pada butir evaluasi ini.',
        timer: 1800,
        showConfirmButton: false
      });
      return;
    }

    ans.skala_evaluator = skorStr;

    // Skor A-E membatalkan tanda "Tidak Bisa Dinilai".
    const btnTak = document.getElementById(`btn-taknilai-${i}-${j}`);
    if (btnTak) btnTak.classList.remove('active');

    // 1. Update <select> element
    const sel = document.getElementById(`sel-eval-${i}-${j}`);
    if (sel) {
      sel.value = skorStr;
      sel.classList.add('bg-success', 'text-white');
      setTimeout(() => sel.classList.remove('bg-success', 'text-white'), 400);
    }

    // 2. Update pill buttons visual di Modern UI
    const group = document.getElementById(`score-pill-group-${i}-${j}`);
    let targetBtn = null;
    if (group) {
      const btns = group.querySelectorAll('.score-pill-btn');
      btns.forEach(btn => {
        btn.classList.remove('active');
        const bbt = btn.getAttribute('data-skor');
        if (bbt === skorStr || (parseFloat(bbt) === parseFloat(skorStr) && !isNaN(parseFloat(bbt)))) {
          btn.classList.add('active');
          targetBtn = btn;
        }
      });
    }

    // 3. Animasi pada pill terpilih
    if (targetBtn) {
      targetBtn.style.transform = 'scale(1.15)';
      targetBtn.style.boxShadow = '0 0 12px rgba(16, 185, 129, 0.4)';
      targetBtn.style.transition = 'all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
      setTimeout(() => {
        targetBtn.style.transform = 'scale(1)';
        targetBtn.style.boxShadow = '';
      }, 300);
    }

    // 4. Efek visual pada tombol Samakan Skor
    const btnSamakan = document.getElementById(`btn-samakan-${i}-${j}`);
    if (btnSamakan) {
      const origHtml = btnSamakan.innerHTML;
      btnSamakan.innerHTML = '<i class="bi bi-check-circle-fill"></i> Disamakan!';
      btnSamakan.classList.remove('btn-modern-outline', 'btn-outline-success', 'text-success', 'border-success');
      btnSamakan.classList.add('btn-success', 'text-white');
      setTimeout(() => {
        btnSamakan.innerHTML = origHtml;
        btnSamakan.classList.remove('btn-success', 'text-white');
        btnSamakan.classList.add('btn-outline-success');
      }, 1200);
    }
  }

  function simpanVal() {
    if(vData.length === 0) return;
    
    // Butir "Tidak Bisa Dinilai" (skor 0) wajib punya catatan sebelum disimpan.
    let jmlBermasalah = 0;
    let firstCardEl = null;
    vData.forEach((soal, i) => {
      soal.jawaban_opd.forEach((ans, j) => {
        if (ans.skala_evaluator !== "" && ans.skala_evaluator !== null && ans.skala_evaluator !== undefined
            && Number(ans.skala_evaluator) === 0
            && String(ans.catatan || "").trim() === "") {
          jmlBermasalah++;
          if (!firstCardEl) firstCardEl = document.getElementById(`catatan-eval-${i}-${j}`);
        }
      });
    });
    if (jmlBermasalah > 0) {
      if (firstCardEl) firstCardEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      Swal.fire({
        icon: 'warning',
        title: 'Catatan Wajib',
        text: 'Ada ' + jmlBermasalah + ' butir "Tidak Bisa Dinilai" yang belum diberi catatan. Lengkapi catatan terlebih dahulu.',
        confirmButtonText: 'Mengerti'
      });
      return;
    }
    
    let itemsToSave = [];
    vData.forEach(soal => {
      soal.jawaban_opd.forEach(ans => {
        itemsToSave.push({
          opd: ans.opd,
          id_soal: soal.id_soal,
          skala_responden: ans.skala_responden,
          skala_evaluator: ans.skala_evaluator,
          catatan: ans.catatan
        });
      });
    });
    
    Swal.showLoading();
    serverCall().withSuccessHandler(() => {
      Swal.fire('Berhasil','Data verifikasi tersimpan','success');
      loadSubKat();
    }).withFailureHandler(err => {
      Swal.fire('Error', 'Gagal menyimpan validasi: ' + (err.message || err), 'error');
    }).simpanVerifikasi(sess.token, { items: itemsToSave });
  }

  }

  function formUserByIndex(idx) {
    if (usersData && usersData[idx]) {

  }

    if (usersData && usersData[idx]) {

  function formUser(oldU = '') {
    let u = { username: '', password: '', role: 'Responden', opd: '' };
    if(oldU) {
      const found = usersData.find(x => x[0] === oldU);
      if(found) u = { username: found[0], password: '', role: found[2], opd: found[3] };
    }
    
    let opdOptions = `<option value="-">`;
    listMasterOPD.forEach(opd => {
      opdOptions += `<option value="${escAttr(opd)}">`;
    });

    Swal.fire({
      title: oldU ? 'Edit User' : 'Tambah User',
      html: `
        <div class="text-start">
          <div class="mb-2"><label class="form-label small fw-bold">Username</label>
            <input id="swal-u" class="form-control" value="${escAttr(u.username)}"></div>
          <div class="mb-2"><label class="form-label small fw-bold">Password</label>
            <input id="swal-p" type="password" class="form-control" value="${u.password}" placeholder="${oldU ? 'Kosongkan jika tidak diubah' : ''}"></div>
          <div class="mb-2"><label class="form-label small fw-bold">Role</label>
            <select id="swal-r" class="form-select">
              <option value="Responden" ${u.role==='Responden'?'selected':''}>Responden</option>
              <option value="Evaluator" ${u.role==='Evaluator'?'selected':''}>Evaluator</option>
              <option value="Admin" ${u.role==='Admin'?'selected':''}>Admin</option>
            </select></div>
          <div class="mb-2"><label class="form-label small fw-bold">Nama OPD</label>
            <input list="opd-list" id="swal-o" class="form-control" value="${escAttr(u.opd)}" placeholder="Ketik inisial OPD...">
            <datalist id="opd-list">
              ${opdOptions}
            </datalist>
          </div>
        </div>
      `,
      showCancelButton: true,
      confirmButtonText: 'Simpan',
      preConfirm: () => {
        const uVal = (document.getElementById('swal-u').value || '').trim();
        const pVal = (document.getElementById('swal-p').value || '').trim();
        const rVal = document.getElementById('swal-r').value;
        const oVal = (document.getElementById('swal-o').value || '').trim() || '-';
        if (!uVal || (!oldU && !pVal)) {

        }

      }
    }).then(res => {
      if(res.isConfirmed && res.value) {
        Swal.showLoading();
        if(oldU) {
          serverCall()
            .withSuccessHandler(r => {
              if (r && r.status === 'success') {
                Swal.fire({ icon: 'success', title: 'Sukses', text: r.message, timer: 1500, showConfirmButton: false });
                loadUsers(true);

              Swal.fire('Error', 'Gagal memproses ke server: ' + (err.message || err), 'error');
            })

        } else {

                loadUsers(true);
              } else {

    .then(r => {

              Swal.fire({ icon: 'success', title: 'Terhapus', text: res.message, timer: 1500, showConfirmButton: false });
              loadUsers(true);
            } else {
              Swal.fire('Error', (res && res.message) ? res.message : 'Gagal menghapus user', 'error');

            Swal.fire('Error', 'Gagal menghapus user: ' + (err.message || err), 'error');
          })

      }
    });
  }

  function generateNextSoalId(currentId) {
    const existingIds = (globalMasterSoalData || []).map(r => (r[0] || '').toString().trim());
    const match = (currentId || '').toString().trim().match(/^([A-Za-z_-]*)(\d+)$/);
    if (match) {
      const prefix = match[1];
      let num = parseInt(match[2], 10);
      let candidate = '';
      do {
        num++;
        candidate = prefix + num;
      } while (existingIds.includes(candidate));
      return candidate;
    }
    let copyId = currentId + "_COPY";
    let counter = 1;
    while (existingIds.includes(copyId)) {
      counter++;
      copyId = currentId + "_COPY" + counter;
    }
    return copyId;
  }

  function duplikatSoalAction(idx) {
    const q = globalMasterSoalData[idx];
    if (!q) return;

    const currentId = (q[0] || "").toString().trim();
    const nextId = generateNextSoalId(currentId);

    Swal.fire({
      title: 'Duplikat Soal',
      html: `
        <div class="text-start small">
          <p class="mb-2">Menduplikasi soal ID: <strong class="text-primary">${currentId}</strong></p>
          <div class="mb-3">
            <label class="form-label fw-bold">ID Soal Baru:</label>
            <input type="text" id="swal-dup-id" class="form-control" value="${escAttr(nextId)}">
          </div>
          <div class="p-2 bg-light rounded border text-muted" style="max-height: 80px; overflow-y: auto; font-size: 0.82rem;">
            <em>"${(q[3] || '').replace(/</g, '&lt;').replace(/>/g, '&gt;')}"</em>
          </div>
        </div>
      `,
      icon: 'question',
      showCancelButton: true,
      showDenyButton: true,
      confirmButtonText: '<i class="bi bi-copy me-1"></i> Duplikat Langsung',
      denyButtonText: '<i class="bi bi-pencil-square me-1"></i> Edit Dulu',
      cancelButtonText: 'Batal',
      confirmButtonColor: '#10B981',
      denyButtonColor: '#0057B7',
      cancelButtonColor: '#6c757d',
      preConfirm: () => {
        const newId = document.getElementById('swal-dup-id').value.trim();
        if (!newId) {
          Swal.showValidationMessage('ID Soal Baru tidak boleh kosong!');
          return false;
        }
        return newId;
      }
    }).then(res => {
      if (res.isConfirmed) {
        const newId = res.value;
        const payload = {
          id: newId,
          kategori: q[1] || "",
          subKategori: q[2] || "",
          pertanyaan: q[3] || "",
          indikator: q[4] || "",
          dataDukung: q[5] || "",
          penjelasan: q[6] || "",
          referensi: q[7] || "",
          bobot: q[8] || "100|80|60|40|20",
          targetOPD: q[9] || ""
        };

        serverCall().withSuccessHandler(r => {
          Swal.close();
          Swal.fire('Berhasil!', `Soal berhasil diduplikasi menjadi <strong>${newId}</strong>!`, 'success');
          loadSoal();
        }).withFailureHandler(err => {
          Swal.fire('Gagal', (err && err.message) ? err.message : 'Gagal menduplikasi soal', 'error');
        }).tambahSoal(sess.token, payload);

      } else if (res.isDenied) {
        const inputId = document.getElementById('swal-dup-id') ? document.getElementById('swal-dup-id').value.trim() : nextId;
        const finalId = inputId || nextId;
        duplicateSourceData = q;

        document.getElementById('tsoal-id').value = finalId;
        document.getElementById('tsoal-kategori').value = q[1] || "";
        document.getElementById('tsoal-subkategori').value = q[2] || "";
        document.getElementById('tsoal-target').value = q[9] || "";
        document.getElementById('tsoal-pertanyaan').value = q[3] || "";
        if (document.getElementById('tsoal-indikator')) document.getElementById('tsoal-indikator').value = q[4] || "";
        document.getElementById('tsoal-bobot').value = q[8] || "100|80|60|40|20";

        const titleEl = document.querySelector('#modalTambahSoal .modal-title') || document.getElementById('modalTambahSoalLabel');
        if (titleEl) {
          titleEl.innerHTML = `<i class="bi bi-copy me-2 text-success"></i>Duplikat Soal (dari ${currentId})`;
        }

        const mEl = document.getElementById('modalTambahSoal');
        if (mEl) {
          const modal = bootstrap.Modal.getOrCreateInstance(mEl);
          modal.show();
        }
      }
    });
  }

  function showModalTambahSoal() {
    duplicateSourceData = null;
    document.getElementById('tsoal-id').value = "";
    document.getElementById('tsoal-kategori').value = "";
    document.getElementById('tsoal-subkategori').value = "";
    document.getElementById('tsoal-target').value = "";

    }
  }

  function simpanSoalBaruAction() {
    const kat = document.getElementById('tsoal-kategori').value.trim();
    const subkat = document.getElementById('tsoal-subkategori').value.trim();
    const pert = document.getElementById('tsoal-pertanyaan').value.trim();
    const indikator = document.getElementById('tsoal-indikator') ? document.getElementById('tsoal-indikator').value.trim() : "";
    const id = document.getElementById('tsoal-id').value.trim();
    const bobot = document.getElementById('tsoal-bobot').value.trim();
    const target = document.getElementById('tsoal-target').value.trim();

    if (!kat || !subkat || !pert) {
      Swal.fire('Peringatan', 'Kategori, Sub Kategori, dan Pertanyaan Wajib Diisi!', 'warning');
      return;
    }

    const payload = {
      id: id,
      kategori: kat,
      subKategori: subkat,
      pertanyaan: pert,
      indikator: indikator,
      bobot: bobot || "100|80|60|40|20",
      targetOPD: target
    };

    if (duplicateSourceData) {
      payload.dataDukung = duplicateSourceData[5] || "";
      payload.penjelasan = duplicateSourceData[6] || "";
      payload.referensi = duplicateSourceData[7] || "";
    }

    Swal.showLoading();
    serverCall().withSuccessHandler(res => {
      Swal.close();
      const mEl = document.getElementById('modalTambahSoal');
      if (mEl) {
        const modal = bootstrap.Modal.getOrCreateInstance(mEl);
        if (modal) modal.hide();
      }
      Swal.fire('Sukses', (res && res.message) ? res.message : 'Soal baru berhasil ditambahkan!', 'success');
      duplicateSourceData = null;
      loadSoal();
    }).withFailureHandler(err => {
      Swal.fire('Gagal', (err && err.message) ? err.message : 'Gagal menyimpan soal baru', 'error');
    }).tambahSoal(sess.token, payload);
  }
