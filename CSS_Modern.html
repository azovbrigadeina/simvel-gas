<!-- CSS Modern SimVel -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
  :root {
    --p: #0057B7;
    --p-hover: #004494;
    --p-light: #EFF6FF;
    --p-subtle: rgba(0, 87, 183, 0.08);
    --accent: #FFD700;
    --accent-hover: #EAB308;
    --accent-light: #FEF9C3;
    --accent-subtle: rgba(255, 215, 0, 0.18);
    
    --bg: #F8FAFC;
    --surface: #FFFFFF;
    --border: #E2E8F0;
    --border-hover: #CBD5E1;
    
    --text-primary: #0F172A;
    --text-secondary: #475569;
    --text-muted: #64748B;
    --text-light: #94A3B8;
    
    --success: #10B981;
    --success-light: #ECFDF5;
    --warning: #F59E0B;
    --warning-light: #FFFBEB;
    --danger: #EF4444;
    --danger-light: #FEF2F2;
    --info: #06B6D4;
    --info-light: #ECFEFF;

    --sidebar-w: 265px;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 20px;

    --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.04);
    --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.06), 0 1px 2px -1px rgba(0, 0, 0, 0.06);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
    --shadow-hover: 0 12px 24px -4px rgba(0, 87, 183, 0.12);
  }

  * {
    box-sizing: border-box;
  }

  body {
    background-color: var(--bg);
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
    font-size: 0.925rem;
    line-height: 1.5;
  }

  .hidden { display: none !important; }

  /* Animations */
  .fade-in { animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ========================================================
     MODERN CARDS & CONTAINERS
     ======================================================== */
  .card-modern {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  }
  .card-modern:hover {
    border-color: var(--border-hover);
  }

  /* Metric KPI Cards */
  .kpi-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1.25rem 1.5rem;
    box-shadow: var(--shadow-sm);
    position: relative;
    overflow: hidden;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .kpi-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }
  .kpi-icon-badge {
    width: 44px;
    height: 44px;
    border-radius: var(--radius-md);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 1.25rem;
  }

  /* ========================================================
     SIDEBAR MODERN
     ======================================================== */
  .sidebar-modern {
    width: var(--sidebar-w);
    height: 100vh;
    position: fixed;
    top: 0;
    left: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 1.15rem 0.85rem;
    z-index: 1040;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    overflow-y: hidden;
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .sidebar-header {
    padding-bottom: 0.85rem;
    margin-bottom: 0.85rem;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .sidebar-user-pill {
    background: var(--p-light);
    border: 1px solid rgba(0, 87, 183, 0.15);
    border-radius: var(--radius-md);
    padding: 0.55rem 0.75rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 0.85rem;
    flex-shrink: 0;
  }
  .sidebar-user-avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--p);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.95rem;
    font-weight: 700;
    flex-shrink: 0;
  }

  /* Custom slim scrollbar for sidebar menu */
  .sidebar-nav-scroll {
    overflow-y: auto;
    overflow-x: hidden !important;
    scrollbar-width: thin;
    scrollbar-color: rgba(0, 87, 183, 0.2) transparent;
    padding-right: 2px;
  }
  .sidebar-nav-scroll::-webkit-scrollbar {
    width: 4px;
  }
  .sidebar-nav-scroll::-webkit-scrollbar-track {
    background: transparent;
  }
  .sidebar-nav-scroll::-webkit-scrollbar-thumb {
    background: rgba(0, 87, 183, 0.2);
    border-radius: 4px;
  }
  .sidebar-nav-scroll::-webkit-scrollbar-thumb:hover {
    background: rgba(0, 87, 183, 0.4);
  }

  .sidebar-menu-category {
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--text-light);
    text-transform: uppercase;
    padding: 0.45rem 0.75rem 0.2rem;
    margin-top: 0.5rem;
    white-space: nowrap;
    user-select: none;
    flex-shrink: 0;
  }
  .sidebar-menu-category:first-of-type {
    margin-top: 0;
    padding-top: 0;
  }

  .sidebar-modern .nav-link {
    cursor: pointer;
    border-radius: var(--radius-md);
    padding: 0.52rem 0.75rem;
    color: var(--text-secondary);
    font-weight: 500;
    font-size: 0.85rem;
    margin-bottom: 0.15rem;
    display: flex;
    align-items: center;
    transition: all 0.2s ease;
    border: 1px solid transparent;
    text-decoration: none;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .sidebar-modern .nav-link i {
    font-size: 1.05rem;
    width: 22px;
    min-width: 22px;
    text-align: center;
    color: var(--text-muted);
    transition: color 0.2s ease;
    flex-shrink: 0;
  }
  .sidebar-modern .nav-link:hover {
    background: var(--bg);
    color: var(--p);
  }
  .sidebar-modern .nav-link:hover i {
    color: var(--p);
  }
  .sidebar-modern .nav-link.active {
    background: var(--p-subtle) !important;
    color: var(--p) !important;
    font-weight: 700;
    border-color: rgba(0, 87, 183, 0.18);
  }
  .sidebar-modern .nav-link.active i {
    color: var(--p);
  }

  .sidebar-footer {
    padding-top: 0.75rem;
    margin-top: auto;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .sidebar-footer .nav-link:hover {
    background: var(--danger-light) !important;
    color: var(--danger) !important;
    border-color: rgba(239, 68, 68, 0.2);
  }
  .sidebar-footer .nav-link:hover i {
    color: var(--danger) !important;
  }

  .sidebar-backdrop {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(15, 23, 42, 0.4);
    backdrop-filter: blur(4px);
    z-index: 1030;
  }

  /* Content area */
  .content-modern {
    margin-left: var(--sidebar-w);
    padding: 2rem 2.25rem;
    min-height: 100vh;
    transition: margin-left 0.3s ease;
  }

  /* Topbar Mobile / Tablet */
  .topbar-mobile {
    display: none;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0.75rem 1.25rem;
    position: sticky;
    top: 0;
    z-index: 1020;
  }

  @media (max-width: 991.98px) {
    .sidebar-modern {
      transform: translateX(-100%);
    }
    .sidebar-modern.show {
      transform: translateX(0);
    }
    .sidebar-backdrop.show {
      display: block;
    }
    .content-modern {
      margin-left: 0 !important;
      padding: 1.25rem;
    }
    .topbar-mobile {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
  }

  /* ========================================================
     MODERN BADGES (PASTEL SOFT TINTS)
     ======================================================== */
  .badge-soft {
    font-weight: 600;
    padding: 0.35rem 0.65rem;
    border-radius: var(--radius-sm);
    font-size: 0.75rem;
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
  }
  .badge-soft-primary { background: var(--p-light); color: var(--p); border: 1px solid rgba(0,87,183,0.2); }
  .badge-soft-success { background: var(--success-light); color: #059669; border: 1px solid rgba(16,185,129,0.2); }
  .badge-soft-warning { background: var(--warning-light); color: #D97706; border: 1px solid rgba(245,158,11,0.2); }
  .badge-soft-danger  { background: var(--danger-light); color: #DC2626; border: 1px solid rgba(239,68,68,0.2); }
  .badge-soft-info    { background: var(--info-light); color: #0891B2; border: 1px solid rgba(6,182,212,0.2); }
  .badge-soft-neutral { background: #F1F5F9; color: var(--text-secondary); border: 1px solid #E2E8F0; }

  /* ========================================================
     LANDING — INFO BATAS WAKTU (DEADLINE)
     ======================================================== */
  .landing-deadline-card {
    display: inline-flex;
    align-items: center;
    gap: 0.85rem;
    padding: 0.7rem 1rem 0.7rem 0.75rem;
    background: rgba(255, 255, 255, 0.94);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1.5px solid rgba(255, 255, 255, 0.9);
    border-radius: 18px;
    box-shadow: 0 12px 28px rgba(0, 20, 50, 0.18);
    max-width: 100%;
    text-align: left;
  }
  .landing-deadline-icon {
    width: 40px;
    height: 40px;
    flex: 0 0 40px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    background: linear-gradient(135deg, #FFD700 0%, #F5B700 100%);
    color: #1E293B;
    font-size: 1.15rem;
    box-shadow: 0 4px 10px rgba(245, 183, 0, 0.35);
  }
  .landing-deadline-label {
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .landing-deadline-date {
    font-size: 0.875rem;
    font-weight: 700;
    color: var(--text-primary);
    line-height: 1.3;
  }
  .landing-deadline-countdown {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    padding: 0.45rem 0.75rem;
    border-radius: 999px;
    background: var(--warning-light);
    border: 1px solid rgba(245, 158, 11, 0.25);
    color: #B45309;
    font-size: 0.78rem;
    font-weight: 700;
    white-space: nowrap;
    transition: background 0.25s ease, border-color 0.25s ease, color 0.25s ease;
  }
  .landing-deadline-dot {
    width: 7px;
    height: 7px;
    flex: 0 0 7px;
    border-radius: 50%;
    background: var(--warning);
    box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.18);
    animation: landingDeadlinePulse 1.8s ease-in-out infinite;
  }
  #landing-deadline-info.is-urgent .landing-deadline-countdown {
    background: var(--danger-light);
    border-color: rgba(239, 68, 68, 0.25);
    color: #B91C1C;
  }
  #landing-deadline-info.is-urgent .landing-deadline-dot {
    background: var(--danger);
    box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.18);
  }
  #landing-deadline-info.is-passed .landing-deadline-countdown {
    background: #F1F5F9;
    border-color: #E2E8F0;
    color: var(--text-muted);
  }
  #landing-deadline-info.is-passed .landing-deadline-dot {
    background: var(--text-light);
    box-shadow: 0 0 0 3px rgba(148, 163, 184, 0.18);
    animation: none;
  }
  @keyframes landingDeadlinePulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.35); opacity: 0.6; }
  }
  @media (max-width: 575.98px) {
    .landing-deadline-card {
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
      row-gap: 0.6rem;
    }
  }

  /* ========================================================
     MODERN DATA TABLES
     ======================================================== */
  .table-modern-wrapper {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }
  .table-modern {
    margin-bottom: 0;
    font-size: 0.88rem;
  }
  .table-modern thead th {
    background: #F8FAFC;
    color: var(--text-muted);
    font-weight: 600;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 0.85rem 1rem;
    border-bottom: 1px solid var(--border);
    border-top: none;
    white-space: nowrap;
  }
  .table-modern tbody td {
    padding: 0.85rem 1rem;
    vertical-align: middle;
    border-bottom: 1px solid var(--border);
    color: var(--text-secondary);
  }
  .table-modern tbody tr:last-child td {
    border-bottom: none;
  }
  .table-modern tbody tr:hover {
    background-color: rgba(0, 87, 183, 0.02);
  }

  /* ========================================================
     LAPORAN PENILAIAN — TABEL REKAP
     ======================================================== */
  .lap-table thead th {
    position: sticky;
    top: 0;
    z-index: 2;
  }
  .lap-col-no { width: 52px; white-space: nowrap; }
  .lap-col-urusan { min-width: 320px; white-space: normal; text-align: left; line-height: 1.35; }
  .lap-col-opd { width: 70px; white-space: nowrap; }
  .lap-col-num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .lap-col-total { text-align: right; white-space: nowrap; }
  .lap-total-value { font-size: 1.05rem; font-weight: 700; color: var(--p); font-variant-numeric: tabular-nums; }
  .lap-bonus { margin-left: .35rem; font-size: .68rem; }
  .lap-col-tipe { min-width: 150px; white-space: nowrap; }
  .lap-tipe-intensitas { font-weight: 600; font-size: .82rem; margin-bottom: .15rem; }
  .lap-col-aksi { width: 96px; }
  .lap-aksi { display: flex; gap: .35rem; justify-content: center; }
  .lap-aksi .btn { padding: .3rem .5rem; }
  .lap-empty { padding: 2rem 1rem; text-align: center; color: var(--text-muted); }
  .lap-table tbody tr:nth-child(even) { background-color: #FBFDFF; }

  /* ========================================================
     TOMBOL CETAK REKAP — HIGHLIGHT + GLOW
     ======================================================== */
  .btn-cetak-rekap {
    background: linear-gradient(135deg, var(--p), #0069DB);
    border: 1px solid rgba(255, 255, 255, 0.55);
    color: #fff;
    font-weight: 700;
    animation: cetakRekapGlow 2s ease-in-out infinite;
  }
  .btn-cetak-rekap:hover {
    background: linear-gradient(135deg, var(--p-hover), var(--p));
    color: #fff;
  }
  .btn-cetak-rekap:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 2px;
  }
  @keyframes cetakRekapGlow {
    0%, 100% { box-shadow: 0 0 0 rgba(0, 87, 183, 0); }
    50% { box-shadow: 0 0 16px rgba(0, 87, 183, 0.65); }
  }
  @media (prefers-reduced-motion: reduce) {
    .btn-cetak-rekap { animation: none; box-shadow: 0 0 10px rgba(0, 87, 183, 0.55); }
  }

  /* ========================================================
     MODERN BUTTONS & INPUTS
     ======================================================== */
  .btn-modern {
    font-weight: 600;
    font-size: 0.875rem;
    border-radius: var(--radius-md);
    padding: 0.55rem 1.15rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: var(--shadow-xs);
  }
  .btn-modern:hover {
    transform: translateY(-1px);
    box-shadow: var(--shadow-sm);
  }
  .btn-modern:active {
    transform: translateY(0);
  }
  .btn-modern-primary {
    background: var(--p);
    color: white;
    border: 1px solid var(--p);
  }
  .btn-modern-primary:hover {
    background: var(--p-hover);
    color: white;
  }
  .btn-modern-outline {
    background: white;
    color: var(--text-secondary);
    border: 1px solid var(--border);
  }
  .btn-modern-outline:hover {
    background: var(--bg);
    border-color: var(--border-hover);
    color: var(--p);
  }

  .form-control-modern, .form-select-modern {
    border-radius: var(--radius-md);
    border: 1.5px solid var(--border);
    padding: 0.55rem 0.9rem;
    font-size: 0.88rem;
    color: var(--text-primary);
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
    background-color: var(--surface);
  }
  .form-control-modern:focus, .form-select-modern:focus {
    border-color: var(--p);
    box-shadow: 0 0 0 3px rgba(0, 87, 183, 0.15);
    outline: none;
  }

  /* ========================================================
     VALIDATION & QUESTIONNAIRE CARDS (RESPONDEN & EVALUATOR)
     ======================================================== */
  .q-card-modern {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1.5rem;
    margin-bottom: 1.25rem;
    box-shadow: var(--shadow-sm);
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
    border-left: 5px solid var(--p);
  }
  .q-card-modern:hover {
    box-shadow: var(--shadow-md);
  }

  .indicator-box-modern {
    background: #F0F9FF;
    border: 1px solid #BAE6FD;
    border-radius: var(--radius-md);
    padding: 0.85rem 1rem;
    font-size: 0.825rem;
    color: #0369A1;
    margin-bottom: 1.25rem;
  }

  /* Interactive Choice Option Cards */
  .choice-card-modern {
    border: 1.5px solid var(--border);
    border-radius: var(--radius-md);
    padding: 0.65rem 0.9rem;
    margin-bottom: 0.5rem;
    background: var(--surface);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: all 0.2s ease;
  }
  .choice-card-modern:hover {
    background: var(--bg);
    border-color: var(--p);
  }
  .choice-card-modern.selected {
    background: var(--p-light);
    border-color: var(--p);
    box-shadow: 0 0 0 1px var(--p);
  }
  .choice-card-modern.disabled {
    cursor: not-allowed !important;
    opacity: 0.75;
  }
  .choice-card-modern.disabled:hover {
    border-color: var(--border) !important;
    background: var(--surface) !important;
  }

  /* Quick Score Pill Buttons (Evaluator) */
  .score-pill-group {
    display: flex;
    gap: 0.35rem;
    flex-wrap: wrap;
  }
  .score-pill-btn {
    border: 1.5px solid var(--border);
    background: white;
    color: var(--text-secondary);
    font-weight: 700;
    font-size: 0.8rem;
    padding: 0.35rem 0.75rem;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .score-pill-btn:hover {
    border-color: var(--p);
    color: var(--p);
  }
  .score-pill-btn.active {
    background: var(--p);
    border-color: var(--p);
    color: white;
  }

  /* Tombol khusus "Tidak Bisa Dinilai" — bobot 0 untuk data tidak lengkap.
     Dibedakan dari pill A-E lewat warna bahaya + glow berdenyut. */
  .score-pill-btn.btn-tak-dinilai {
    border: 1.5px solid var(--danger);
    background: var(--danger-light);
    color: #B91C1C;
    animation: takDinilaiGlow 1.8s ease-in-out infinite;
  }
  .score-pill-btn.btn-tak-dinilai:hover {
    background: #FEE2E2;
    border-color: #B91C1C;
    color: #991B1B;
  }
  .score-pill-btn.btn-tak-dinilai.active {
    background: var(--danger);
    border-color: var(--danger);
    color: white;
    animation: takDinilaiGlowActive 1.4s ease-in-out infinite;
  }
  @keyframes takDinilaiGlow {
    0%, 100% { box-shadow: 0 0 0 rgba(220, 38, 38, 0); }
    50% { box-shadow: 0 0 10px rgba(220, 38, 38, 0.45); }
  }
  @keyframes takDinilaiGlowActive {
    0%, 100% { box-shadow: 0 0 4px rgba(220, 38, 38, 0.55); }
    50% { box-shadow: 0 0 16px rgba(220, 38, 38, 0.85); }
  }
  @media (prefers-reduced-motion: reduce) {
    .score-pill-btn.btn-tak-dinilai, .score-pill-btn.btn-tak-dinilai.active { animation: none; box-shadow: 0 0 8px rgba(220, 38, 38, 0.5); }
  }

  /* Sticky Action Bar */
  .sticky-action-bar {
    position: sticky;
    bottom: 1.25rem;
    z-index: 1010;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 0.75rem 1.25rem;
