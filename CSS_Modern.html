<!-- CSS Modern SimVel -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
  :root {
    --p: #0057B7;
    --p-hover: #004494;
    --p-light: #EFF6FF;
    --p-subtle: rgba(0, 87, 183, 0.08);
    --accent: #FFD700;
    --accent-hover: #EAB308;
    --accent-light: #FEF9C3;
    --accent-subtle: rgba(255, 215, 0, 0.18);
    
    --bg: #F8FAFC;
    --surface: #FFFFFF;
    --border: #E2E8F0;
    --border-hover: #CBD5E1;
    
    --text-primary: #0F172A;
    --text-secondary: #475569;
    --text-muted: #64748B;
    --text-light: #94A3B8;
    
    --success: #10B981;
    --success-light: #ECFDF5;
    --warning: #F59E0B;
    --warning-light: #FFFBEB;
    --danger: #EF4444;
    --danger-light: #FEF2F2;
    --info: #06B6D4;
    --info-light: #ECFEFF;

    --sidebar-w: 260px;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 20px;

    --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.04);
    --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.06), 0 1px 2px -1px rgba(0, 0, 0, 0.06);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
    --shadow-hover: 0 12px 24px -4px rgba(0, 87, 183, 0.12);
  }

  * {
    box-sizing: border-box;
  }

  body {
    background-color: var(--bg);
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
    font-size: 0.925rem;
    line-height: 1.5;
  }

  .hidden { display: none !important; }

  /* Animations */
  .fade-in { animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ========================================================
     MODERN CARDS & CONTAINERS
     ======================================================== */
  .card-modern {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  }
  .card-modern:hover {
    border-color: var(--border-hover);
  }

  /* Metric KPI Cards */
  .kpi-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1.25rem 1.5rem;
    box-shadow: var(--shadow-sm);
    position: relative;
    overflow: hidden;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .kpi-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }
  .kpi-icon-badge {
    width: 44px;
    height: 44px;
    border-radius: var(--radius-md);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 1.25rem;
  }

  /* ========================================================
     SIDEBAR MODERN
     ======================================================== */
  .sidebar-modern {
    width: var(--sidebar-w);
    height: 100vh;
    position: fixed;
    top: 0;
    left: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 1.25rem 1rem;
    z-index: 1040;
    display: flex;
    flex-direction: column;
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .sidebar-header {
    padding-bottom: 1rem;
    margin-bottom: 1rem;
    border-bottom: 1px solid var(--border);
  }

  .sidebar-user-pill {
    background: var(--p-light);
    border: 1px solid rgba(0, 87, 183, 0.15);
    border-radius: var(--radius-md);
    padding: 0.6rem 0.8rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1.25rem;
  }
  .sidebar-user-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--p);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    font-weight: 700;
  }

  .sidebar-menu-category {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--text-light);
    text-transform: uppercase;
    padding: 0.5rem 0.75rem 0.25rem;
    margin-top: 0.5rem;
  }

  .sidebar-modern .nav-link {
    cursor: pointer;
    border-radius: var(--radius-md);
    padding: 0.6rem 0.85rem;
    color: var(--text-secondary);
    font-weight: 500;
    font-size: 0.88rem;
    margin-bottom: 0.25rem;
    display: flex;
    align-items: center;
    transition: all 0.2s ease;
    border: 1px solid transparent;
  }
  .sidebar-modern .nav-link i {
    font-size: 1.1rem;
    width: 24px;
    text-align: center;
    color: var(--text-muted);
    transition: color 0.2s ease;
  }
  .sidebar-modern .nav-link:hover {
    background: var(--bg);
    color: var(--p);
  }
  .sidebar-modern .nav-link:hover i {
    color: var(--p);
  }
  .sidebar-modern .nav-link.active {
    background: var(--p-subtle) !important;
    color: var(--p) !important;
    font-weight: 700;
    border-color: rgba(0, 87, 183, 0.18);
  }
  .sidebar-modern .nav-link.active i {
    color: var(--p);
  }

  .sidebar-backdrop {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(15, 23, 42, 0.4);
    backdrop-filter: blur(4px);
    z-index: 1030;
  }

  /* Content area */
  .content-modern {
    margin-left: var(--sidebar-w);
    padding: 2rem 2.25rem;
    min-height: 100vh;
    transition: margin-left 0.3s ease;
  }

  /* Topbar Mobile / Tablet */
  .topbar-mobile {
    display: none;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0.75rem 1.25rem;
    position: sticky;
    top: 0;
    z-index: 1020;
  }

  @media (max-width: 991.98px) {
    .sidebar-modern {
      transform: translateX(-100%);
    }
    .sidebar-modern.show {
      transform: translateX(0);
    }
    .sidebar-backdrop.show {
      display: block;
    }
    .content-modern {
      margin-left: 0 !important;
      padding: 1.25rem;
    }
    .topbar-mobile {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
  }

  /* ========================================================
     MODERN BADGES (PASTEL SOFT TINTS)
     ======================================================== */
  .badge-soft {
    font-weight: 600;
    padding: 0.35rem 0.65rem;
    border-radius: var(--radius-sm);
    font-size: 0.75rem;
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
  }
  .badge-soft-primary { background: var(--p-light); color: var(--p); border: 1px solid rgba(0,87,183,0.2); }
  .badge-soft-success { background: var(--success-light); color: #059669; border: 1px solid rgba(16,185,129,0.2); }
  .badge-soft-warning { background: var(--warning-light); color: #D97706; border: 1px solid rgba(245,158,11,0.2); }
  .badge-soft-danger  { background: var(--danger-light); color: #DC2626; border: 1px solid rgba(239,68,68,0.2); }
  .badge-soft-info    { background: var(--info-light); color: #0891B2; border: 1px solid rgba(6,182,212,0.2); }
  .badge-soft-neutral { background: #F1F5F9; color: var(--text-secondary); border: 1px solid #E2E8F0; }

  /* ========================================================
     MODERN DATA TABLES
     ======================================================== */
  .table-modern-wrapper {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }
  .table-modern {
    margin-bottom: 0;
    font-size: 0.88rem;
  }
  .table-modern thead th {
    background: #F8FAFC;
    color: var(--text-muted);
    font-weight: 600;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 0.85rem 1rem;
    border-bottom: 1px solid var(--border);
    border-top: none;
    white-space: nowrap;
  }
  .table-modern tbody td {
    padding: 0.85rem 1rem;
    vertical-align: middle;
    border-bottom: 1px solid var(--border);
    color: var(--text-secondary);
  }
  .table-modern tbody tr:last-child td {
    border-bottom: none;
  }
  .table-modern tbody tr:hover {
    background-color: rgba(0, 87, 183, 0.02);
  }

  /* ========================================================
     MODERN BUTTONS & INPUTS
     ======================================================== */
  .btn-modern {
    font-weight: 600;
    font-size: 0.875rem;
    border-radius: var(--radius-md);
    padding: 0.55rem 1.15rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: var(--shadow-xs);
  }
  .btn-modern:hover {
    transform: translateY(-1px);
    box-shadow: var(--shadow-sm);
  }
  .btn-modern:active {
    transform: translateY(0);
  }
  .btn-modern-primary {
    background: var(--p);
    color: white;
    border: 1px solid var(--p);
  }
  .btn-modern-primary:hover {
    background: var(--p-hover);
    color: white;
  }
  .btn-modern-outline {
    background: white;
    color: var(--text-secondary);
    border: 1px solid var(--border);
  }
  .btn-modern-outline:hover {
    background: var(--bg);
    border-color: var(--border-hover);
    color: var(--p);
  }

  .form-control-modern, .form-select-modern {
    border-radius: var(--radius-md);
    border: 1.5px solid var(--border);
    padding: 0.55rem 0.9rem;
    font-size: 0.88rem;
    color: var(--text-primary);
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
    background-color: var(--surface);
  }
  .form-control-modern:focus, .form-select-modern:focus {
    border-color: var(--p);
    box-shadow: 0 0 0 3px rgba(0, 87, 183, 0.15);
    outline: none;
  }

  /* ========================================================
     VALIDATION & QUESTIONNAIRE CARDS (RESPONDEN & EVALUATOR)
     ======================================================== */
  .q-card-modern {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1.5rem;
    margin-bottom: 1.25rem;
    box-shadow: var(--shadow-sm);
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
    border-left: 5px solid var(--p);
  }
  .q-card-modern:hover {
    box-shadow: var(--shadow-md);
  }

  .indicator-box-modern {
    background: #F0F9FF;
    border: 1px solid #BAE6FD;
    border-radius: var(--radius-md);
    padding: 0.85rem 1rem;
    font-size: 0.825rem;
    color: #0369A1;
    margin-bottom: 1.25rem;
  }

  /* Interactive Choice Option Cards */
  .choice-card-modern {
    border: 1.5px solid var(--border);
    border-radius: var(--radius-md);
    padding: 0.65rem 0.9rem;
    margin-bottom: 0.5rem;
    background: var(--surface);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: all 0.2s ease;
  }
  .choice-card-modern:hover {
    background: var(--bg);
    border-color: var(--p);
  }
  .choice-card-modern.selected {
    background: var(--p-light);
    border-color: var(--p);
    box-shadow: 0 0 0 1px var(--p);
  }

  /* Quick Score Pill Buttons (Evaluator) */
  .score-pill-group {
    display: flex;
    gap: 0.35rem;
    flex-wrap: wrap;
  }
  .score-pill-btn {
    border: 1.5px solid var(--border);
    background: white;
    color: var(--text-secondary);
    font-weight: 700;
    font-size: 0.8rem;
    padding: 0.35rem 0.75rem;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .score-pill-btn:hover {
    border-color: var(--p);
    color: var(--p);
  }
  .score-pill-btn.active {
    background: var(--p);
    border-color: var(--p);
    color: white;
  }

  /* Sticky Action Bar */
  .sticky-action-bar {
    position: sticky;
    bottom: 1.25rem;
    z-index: 1010;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 0.75rem 1.25rem;
    box-shadow: var(--shadow-lg);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    margin-top: 1.5rem;
  }

  /* Stepper Progress Bar (Responden) */
  .stepper-progress-track {
    width: 100%;
    height: 6px;
    background: #E2E8F0;
    border-radius: 999px;
    overflow: hidden;
    margin-top: 0.5rem;
  }
  .stepper-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--p), #3B82F6);
    border-radius: 999px;
    transition: width 0.4s ease;
  }

  /* Evidence Link Badge */
  .evidence-chip {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.35rem 0.75rem;
    border-radius: var(--radius-md);
    background: #F1F5F9;
    border: 1px solid #CBD5E1;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-primary);
    text-decoration: none;
    transition: all 0.2s ease;
  }
  .evidence-chip:hover {
    background: #E2E8F0;
    color: var(--p);
  }

  /* ========================================================
     TAB NAVIGATION MODERN
     ======================================================== */
  .nav-tabs-modern {
    border-bottom: 2px solid var(--border);
    gap: 0.5rem;
  }
  .nav-tabs-modern .nav-link {
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text-muted);
    font-weight: 600;
    font-size: 0.88rem;
    padding: 0.75rem 1.25rem;
    margin-bottom: -2px;
    border-radius: 0;
    transition: all 0.2s ease;
  }
  .nav-tabs-modern .nav-link:hover {
    color: var(--p);
    border-bottom-color: #CBD5E1;
  }
  .nav-tabs-modern .nav-link.active {
    color: var(--p);
    border-bottom-color: var(--p);
    background: transparent;
  }

  /* ========================================================
     LOGIN CARD & LANDING PAGE (REFINED)
     ======================================================== */
  .login-card-modern {
    background: rgba(255, 255, 255, 0.98);
    backdrop-filter: blur(20px);
    border-radius: var(--radius-xl);
    padding: 2.5rem;
    box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.15);
    width: 100%;
    max-width: 420px;
    margin: auto;
    border: 1px solid rgba(255, 255, 255, 0.6);
  }

  /* Re-use loading screen from base */
  <?!= include('CSS'); ?>
</style>
